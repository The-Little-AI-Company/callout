name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # Build number shown in settings (PRD L6): run number plus short SHA.
      - name: Build
        env:
          CALLOUT_BUILD: ${{ github.run_number }}-${{ github.sha }}
          # Signing (PRD L6): set these secrets before the first invite wave.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      # Stable names so the site can link to /releases/latest/download/Callout-Setup.exe.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/Callout-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/Callout.msi
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/bundle/msi/*.msi out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: callout-windows-${{ github.run_number }}
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="Windows installer for Callout ${tag}. Unsigned beta build: SmartScreen will warn, choose More info, then Run anyway. Setup guide: https://github.com/The-Little-AI-Company/callout/blob/main/docs/SETUP.md"
          gh release create "$tag" out/Callout-Setup.exe out/Callout.msi --title "Callout ${tag}" --notes "$notes" --repo "$GITHUB_REPOSITORY" || gh release upload "$tag" out/Callout-Setup.exe out/Callout.msi --clobber --repo "$GITHUB_REPOSITORY"
