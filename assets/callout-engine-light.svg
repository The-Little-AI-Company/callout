<title id="t">Callout engine</title><desc id="d">A hotkey captures text. The fast lane sends it to Jev for signals and techniques. The deep lane uses an LLM helper to extract claims, Tavily and fetched pages for evidence, and Jev to judge support. Code computes the result from the verdicts.</desc>
